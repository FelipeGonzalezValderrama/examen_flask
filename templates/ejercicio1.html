<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Cálculo de compras</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="tarjeta">
        <h1>Calculo de compras</h1>
        <form method="POST" action="{{ url_for('ejercicio1') }}">
            <label for="nombre">Ingresa tu nombre</label>
            <input type="text" id="nombre" name="nombre" required
                   value="{{ request.form.get('nombre', '') }}">

            <label for="edad">Ingresa tu edad</label>
            <input type="number" id="edad" name="edad" min="0" required
                   value="{{ request.form.get('edad', '') }}">

            <label for="cantidad">Ingresa la cantidad de tarros de pintura a comprar</label>
            <input type="number" id="cantidad" name="cantidad" min="0" required
                   value="{{ request.form.get('cantidad', '') }}">

            <button type="submit">Calcular</button>
        </form>

        {% if resultado %}
        <div class="resultado">
            <p>Nombre del cliente: {{ resultado.nombre }}</p>
            <p>Total sin descuento: ${{ resultado.total_sin_descuento }}</p>
            <p>El descuento es : ${{ resultado.descuento }}</p>
            <p>El total a pagar es de : ${{ resultado.total_a_pagar }}</p>
        </div>
        {% endif %}

        <a class="volver" href="{{ url_for('index') }}">&larr; Volver al menú</a>
    </div>
</body>
</html>
